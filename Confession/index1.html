<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Message for habla</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>

    <div id="container">
        <div class="envelope-wrapper" id="envelope-wrapper" onclick="startSequence()">
            <div class="envelope">
                <div class="front">
                    <div class="seal">J</div>
                </div>
                <div class="back"></div>
                <div class="top-flap" id="flap"></div>
                <div class="letter-preview"></div>
            </div>
            <p class="instruction-text">Tap to open for Jana</p>
        </div>

        <div id="flower-field"></div>

        <div id="final-card" class="hidden">
            <div class="paper">
                <div class="paper-content">
                    <p class="date" id="current-date"></p>
                    <p class="greeting">Dear habla,</p>
                    
                    <p class="main-message">
                        فكراني بحبك أو هحب واحده زيك و بقا عامل لك موقع مخصوص لا ده في خيالك كله معمول بالذكاء الإصطناعي هو أنتي أصلا تتحبي ده أنتي عايزه دعاوي الدنيا علشان حد يبصلك و في الختام ياريت مشوفش وشك تاني يا بومه
                                 </p>
                    
                    <div class="polaroid-container">
                        <div class="polaroid-frame">✨</div>
                        <div class="polaroid-frame">🌷</div>
                        <div class="polaroid-frame">✨</div>
                    </div>
                    
                    <p class="signature">With sincere respect, <br><strong>Seif</strong></p>
                </div>
            </div>
        </div>
    </div>

    <script src="script1.js"></script>
</body>
</html>
